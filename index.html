<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT × MEDICAL | COMING SOON</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root { color-scheme: dark; --accent: #22d3ee; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  a { color: var(--accent); }
  a:hover { opacity: 0.8; }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.75); }
  }
  @keyframes blink-at {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0.15; }
  }
  @keyframes scanline {
    0% { transform: translateY(-100%); }
    100% { transform: translateY(420%); }
  }
  .page {
    position: relative;
    width: 100%;
    min-height: 100vh;
    background: oklch(0.15 0.02 250);
    overflow: hidden;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    color: oklch(0.95 0.005 250);
    display: flex;
    flex-direction: column;
  }
  .grid-bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(oklch(0.95 0.005 250 / 0.045) 1px, transparent 1px),
      linear-gradient(90deg, oklch(0.95 0.005 250 / 0.045) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }
  .glow {
    position: absolute; top: -25%; left: 50%; transform: translateX(-50%);
    width: 1200px; height: 1200px;
    background: radial-gradient(circle, color-mix(in oklch, var(--accent) 13%, transparent) 0%, transparent 62%);
    pointer-events: none;
  }
  .scanline {
    position: absolute; left: 0; right: 0; top: 0; height: 160px;
    background: linear-gradient(to bottom, color-mix(in oklch, var(--accent) 7%, transparent), transparent);
    animation: scanline 7s linear infinite;
    pointer-events: none;
  }
  .corner { position: absolute; width: 28px; height: 28px; border-color: var(--accent); }
  .corner.tl { top: 28px; left: 28px; border-top: 2px solid; border-left: 2px solid; }
  .corner.tr { top: 28px; right: 28px; border-top: 2px solid; border-right: 2px solid; }
  .corner.bl { bottom: 28px; left: 28px; border-bottom: 2px solid; border-left: 2px solid; }
  .corner.br { bottom: 28px; right: 28px; border-bottom: 2px solid; border-right: 2px solid; }
  .status {
    position: relative; display: flex; align-items: center; gap: 10px;
    padding: 40px 56px 0;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    animation: pulse-dot 1.8s ease-in-out infinite; flex: none;
  }
  .status-label { font-size: 13px; font-weight: 500; letter-spacing: 0.28em; color: var(--accent); }
  .hero {
    position: relative; flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 26px;
    padding: 24px; text-align: center;
  }
  .title {
    margin: 0; font-family: 'Space Grotesk', ui-sans-serif, sans-serif; font-weight: 700;
    font-size: clamp(38px, 7vw, 88px); letter-spacing: 0.01em; line-height: 1;
  }
  .title .x { color: var(--accent); }
  .title .at { color: var(--accent); animation: blink-at 1.3s step-end infinite; display: inline-block; }
  .badge {
    font-size: 15px; font-weight: 500; letter-spacing: 0.32em;
    padding: 10px 22px; border: 1px solid color-mix(in oklch, var(--accent) 33%, transparent);
    color: var(--accent);
  }
  .keywords {
    display: flex; align-items: center; gap: 18px; margin-top: 8px;
    font-size: 13px; font-weight: 500; letter-spacing: 0.24em;
    color: oklch(0.95 0.005 250 / 0.72); flex-wrap: wrap; justify-content: center;
  }
  .keywords .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); flex: none; }
  .steps { display: flex; flex-direction: column; gap: 10px; width: min(360px, 78vw); margin-top: 26px; }
  .step { display: flex; align-items: center; gap: 14px; }
  .step .num { font-size: 12px; color: var(--accent); width: 22px; text-align: left; }
  .step .line { flex: 1; height: 1px; background: oklch(0.95 0.005 250 / 0.18); }
  .links { display: flex; align-items: center; gap: 12px; margin-top: 30px; flex-wrap: wrap; justify-content: center; }
  .links a {
    font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; font-weight: 500;
    letter-spacing: 0.18em; text-decoration: none; padding: 10px 18px;
    border: 1px solid oklch(0.95 0.005 250 / 0.28); transition: border-color 0.15s, color 0.15s;
    color: oklch(0.95 0.005 250);
  }
  .links a:hover { border-color: var(--accent); color: var(--accent); opacity: 1; }
  .tagline {
    position: relative; text-align: center; padding: 0 24px 56px;
    font-family: 'Space Grotesk', ui-sans-serif, sans-serif; font-weight: 700;
    font-size: clamp(17px, 2.6vw, 26px); letter-spacing: 0.06em; line-height: 1.45;
  }
  .tagline .amp { color: var(--accent); }
</style>
</head>
<body>
<div class="page">
  <div class="grid-bg"></div>
  <div class="glow"></div>
  <div class="scanline"></div>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="status">
    <div class="status-dot"></div>
    <div class="status-label">SYSTEM ONLINE</div>
  </div>

  <div class="hero">
    <h1 class="title">IT <span class="x">×</span> MEDICAL <span class="at">@</span></h1>

    <div class="badge">[ COMING SOON ]</div>

    <div class="keywords">
      <span>AI</span>
      <span class="dot"></span>
      <span>DATA</span>
      <span class="dot"></span>
      <span>CARE</span>
      <span class="dot"></span>
      <span>SUPPORT</span>
    </div>

    <div class="steps">
      <div class="step"><span class="num">01</span><span class="line"></span></div>
      <div class="step"><span class="num">02</span><span class="line"></span></div>
      <div class="step"><span class="num">03</span><span class="line"></span></div>
    </div>

    <div class="links">
      <a href="https://mahitogawa.github.io/ai/">AI-PASSPORT</a>
      <a href="https://mahitogawa.github.io/ai/it-passport.html">IT-PASSPORT</a>
      <a href="https://mahitogawa.github.io/nyanlog/mental.html">MENTAL</a>
    </div>
  </div>

  <div class="tagline">THE FUTURE OF<br>IT <span class="amp">&amp;</span> MEDICAL</div>
</div>
</body>
</html>
